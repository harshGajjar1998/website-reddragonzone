# Builds the static site and uploads what changed to a plain Hostinger website (LiteSpeed) over FTPS
# (scripts/deploy-ftp.sh).
# Runs on pushes to this branch, by hand (Actions → Run workflow), and when the CMS publishes
# (it calls the workflow_dispatch API with its GitHub token; see CMS_GITHUB_* in the CMS .env).
#
# Repository settings → Secrets and variables → Actions:
#   variables  CMS_API_URL (the CMS), FTP_HOST, FTP_USER (an FTP account limited to the website's folder)
#   secret     FTP_PASSWORD
name: Deploy to Hostinger

on:
  push:
    branches: [feature/cms-integration]
  workflow_dispatch:
    inputs:
      reason:
        description: Why (shown in the run title)
        required: false
        default: Manual deploy

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.reason || github.event.head_commit.message }}

# One deploy at a time; a publish during a deploy queues (only the newest waits), never cuts an upload short
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A full upload (first deploy, or after one was cut short) takes ~25 min; a normal publish a minute or two
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (static export → out/)
        run: pnpm build
        env:
          CMS_API_URL: ${{ vars.CMS_API_URL }}

      - name: Long-cache Next's hashed assets
        run: |
          cat > out/_next/static/.htaccess <<'HT'
          <IfModule mod_headers.c>
              Header set Cache-Control "public, max-age=31536000, immutable"
          </IfModule>
          HT

      - name: Upload over FTPS (changed files only)
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_USER: ${{ vars.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          bash scripts/deploy-ftp.sh out
